name: Test Windows

on:
  workflow_call:

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Checkout first: actions/checkout cleans the workspace, so it must run
      # before the artifact download or it would wipe the downloaded zip.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download Windows zip
        uses: actions/download-artifact@v8
        with:
          name: windows-zip
          path: dist-zip

      # From-source first (does the code run?), then the packaged EXE (does
      # packaging run?) -- this order isolates a code bug from a build bug.
      - name: Launch-test from source
        run: |
          pip install -r requirements.txt
          python main.py --self-check

      # Float UI smoke: prove the Win32 overlay backend selects and the full
      # enter() arc runs on a real Windows session (the runner has an
      # interactive desktop). Isolated config with start-in-float pre-set;
      # the trace stamps are the oracle (running-code proof, not exit code:
      # the app is killed while running by design).
      - name: Float UI overlay smoke (source)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\ttmt-float-cfg"
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          Set-Content -Path "$cfg\settings.json" -Value '{ "start_in_float_ui_mode": true }'
          $env:TTMT_CONFIG_DIR = $cfg
          $env:PYTHON_KEYRING_BACKEND = 'keyring.backends.null.Keyring'
          $env:TTMT_OVERLAY_TRACE = '1'
          $env:TTMT_NO_VENV_REEXEC = '1'
          # Keep this process the app: no relaunch as administrator.
          $env:TTMT_NO_ELEVATE = '1'
          # Float UI lives in the classic window, now behind the escape hatch.
          $env:TTMT_NEXT_UI = '0'
          $proc = Start-Process -FilePath python -ArgumentList 'main.py' -PassThru `
            -RedirectStandardOutput float-out.txt -RedirectStandardError float-err.txt
          Start-Sleep 25
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "--- float smoke stderr (trace) ---"
          if (Test-Path float-err.txt) { Get-Content float-err.txt }
          $err = if (Test-Path float-err.txt) { Get-Content float-err.txt -Raw } else { '' }
          if ($err -notmatch 'Win32OverlayBackend AVAILABLE') {
            throw 'Float smoke: Win32 overlay backend did not select'
          }
          if ($err -notmatch 'cluster\.enter OK: active=True') {
            throw 'Float smoke: startup float enter did not complete'
          }
          Write-Host 'FLOAT SMOKE OK'

      # Launchpad smoke: the default window on a real Windows session. The
      # running-code stamps are the oracle: the launchpad window, the
      # headless session and the strips' attach mechanism each print once,
      # and the strips' Win32 overlay backend selects.
      - name: Launchpad smoke (source)
        shell: pwsh
        run: |
          $cfg = "$env:RUNNER_TEMP\ttmt-launchpad-cfg"
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          $env:TTMT_CONFIG_DIR = $cfg
          $env:PYTHON_KEYRING_BACKEND = 'keyring.backends.null.Keyring'
          $env:TTMT_OVERLAY_TRACE = '1'
          $env:TTMT_NO_VENV_REEXEC = '1'
          $env:TTMT_NO_ELEVATE = '1'
          $proc = Start-Process -FilePath python -ArgumentList 'main.py' -PassThru `
            -RedirectStandardOutput launchpad-out.txt -RedirectStandardError launchpad-err.txt
          Start-Sleep 25
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          $o = if (Test-Path launchpad-out.txt) { Get-Content launchpad-out.txt -Raw } else { '' }
          $e = if (Test-Path launchpad-err.txt) { Get-Content launchpad-err.txt -Raw } else { '' }
          $out = "$o`n$e"
          Write-Host "--- launchpad smoke output ---"
          Write-Host $out
          foreach ($stamp in @('[NextUI] launchpad window + float strips', '[ToonSession] core active', '[Strips] attach=')) {
            if (-not $out.Contains($stamp)) { throw "Launchpad smoke: missing stamp: $stamp" }
          }
          if ($out -notmatch 'Win32OverlayBackend AVAILABLE') {
            throw 'Launchpad smoke: Win32 overlay backend did not select'
          }
          if ($out -match 'Traceback') { throw 'Launchpad smoke: a traceback was printed' }
          Write-Host 'LAUNCHPAD SMOKE OK'

      - name: Launch-test the packaged EXE
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist-zip\ToonTownMultiTool-Portable-*.zip)[0].FullName
          Expand-Archive -Path $zip -DestinationPath exe-test
          # The EXE is a GUI-subsystem app (console=False): PowerShell's call
          # operator never populates $LASTEXITCODE for it, and it has no
          # console for the job log to capture. Start-Process -Wait -PassThru
          # gives the real .ExitCode; redirecting the streams to files makes
          # a frozen-build failure visible instead of an opaque exit code.
          $exe = (Resolve-Path "exe-test\ToonTownMultiTool.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-check" -Wait -PassThru `
            -RedirectStandardOutput exe-out.txt -RedirectStandardError exe-err.txt
          Write-Host "--- EXE stdout ---"
          if (Test-Path exe-out.txt) { Get-Content exe-out.txt }
          Write-Host "--- EXE stderr ---"
          if (Test-Path exe-err.txt) { Get-Content exe-err.txt }
          Write-Host "--- EXE exit code: $($proc.ExitCode) ---"
          if ($proc.ExitCode -ne 0) { throw "EXE --self-check failed ($($proc.ExitCode))" }

  test-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: installer-in

      - name: Silent install
        shell: pwsh
        run: |
          # Inno setup.exe is GUI-subsystem: PowerShell's `&` operator leaves
          # $LASTEXITCODE as $null for it, same quirk handled in test-windows
          # above. Use Start-Process -Wait -PassThru to get the real exit code.
          $installer = (Get-ChildItem installer-in\*.exe)[0].FullName
          $target = "$env:RUNNER_TEMP\ttmt-install"
          $installLog = "$env:RUNNER_TEMP\install.log"
          $proc = Start-Process -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=$target", "/LOG=$installLog", "/TASKS=desktopicon" `
            -Wait -PassThru
          Write-Host "--- installer exit code: $($proc.ExitCode) ---"
          if (Test-Path $installLog) {
            Write-Host "--- install.log ---"
            Get-Content $installLog
          }
          if ($proc.ExitCode -ne 0) { throw "Installer exited $($proc.ExitCode)" }
          if (-not (Test-Path "$target\ToonTownMultiTool.exe")) {
            throw "Expected EXE not present at $target\ToonTownMultiTool.exe"
          }
          # The legacy path (old apps update with /SILENT, admins deploy with
          # /VERYSILENT) must not change: no window, the wizard's own config
          # step, this build's code. Stamps, not the exit code alone.
          $log = Get-Content $installLog -Raw
          if ($log -notmatch '\[RollCall\] setup .* rollcall=bundled silent=yes .*window-run=no') {
            throw 'Setup stamp missing: not the build under test, or not the legacy path'
          }
          if ($log -notmatch 'Parameters: --apply-installer-config') { throw 'the wizard config step did not run' }
          if ($log -match 'starting the install window') { throw 'a silent install must not show the window' }
          Write-Host 'LEGACY SILENT INSTALL OK'

      - name: Launch-test the installed EXE
        shell: pwsh
        run: |
          # Same Start-Process pattern as test-windows: GUI-subsystem EXE has
          # no console output, so we redirect streams to files and inspect
          # the real exit code via -PassThru.
          $exe = "$env:RUNNER_TEMP\ttmt-install\ToonTownMultiTool.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-check" -Wait -PassThru `
            -RedirectStandardOutput exe-out.txt -RedirectStandardError exe-err.txt
          Write-Host "--- EXE stdout ---"
          if (Test-Path exe-out.txt) { Get-Content exe-out.txt }
          Write-Host "--- EXE stderr ---"
          if (Test-Path exe-err.txt) { Get-Content exe-err.txt }
          Write-Host "--- EXE exit code: $($proc.ExitCode) ---"
          if ($proc.ExitCode -ne 0) { throw "Installed EXE --self-check failed ($($proc.ExitCode))" }

      - name: Silent uninstall
        shell: pwsh
        run: |
          $unins = "$env:RUNNER_TEMP\ttmt-install\unins000.exe"
          if (Test-Path $unins) {
            $proc = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Uninstaller exited $($proc.ExitCode)" }
          } else {
            throw "Expected uninstaller at $unins"
          }

  # Roll Call on the runner's real desktop: every path of the new installer,
  # in order, on one clean machine (scripts/rollcall_windows_check.ps1). Each
  # phase proves its outcome with files, registry keys and log stamps.
  test-windows-rollcall:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: installer-in

      - name: Locate Setup
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer-in\*.exe)[0].FullName
          "ROLLCALL_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ROLLCALL_OUT=$env:RUNNER_TEMP\rollcall-check" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cancel mid-copy leaves nothing (fresh PC)
        shell: pwsh
        run: ./scripts/rollcall_windows_check.ps1 -Phase cancel -Setup $env:ROLLCALL_SETUP -Out $env:ROLLCALL_OUT

      - name: Double-click install through the window
        # Runs after an earlier phase failed too: each phase checks what it
        # needs, and one failure must not hide the rest.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/rollcall_windows_check.ps1 -Phase install -Setup $env:ROLLCALL_SETUP -Out $env:ROLLCALL_OUT

      - name: A failed repair puts the previous version back
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/rollcall_windows_check.ps1 -Phase fail -Setup $env:ROLLCALL_SETUP -Out $env:ROLLCALL_OUT

      - name: Update through the app handoff and the update window
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/rollcall_windows_check.ps1 -Phase update -Setup $env:ROLLCALL_SETUP -Out $env:ROLLCALL_OUT

      - name: Uninstall through the uninstall window
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/rollcall_windows_check.ps1 -Phase uninstall -Setup $env:ROLLCALL_SETUP -Out $env:ROLLCALL_OUT

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollcall-windows-check
          path: ${{ env.ROLLCALL_OUT }}
          if-no-files-found: warn
